services:
  # -------------------------------------------------------------
  # 1. FastAPI + PyTorch YOLO11n Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: webcam-yolo-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter # Starter plan recommended for PyTorch memory (~1GB RAM)
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_CONFIDENCE
        value: "0.35"
      - key: DEVICE
        value: cpu

  # -------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: webcam-yolo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: webcam-yolo-backend
          property: host
    headers:
      - path: /*
        name: Permissions-Policy
        value: camera=(self)

